name: Deploy on Self-Hosted Runner

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        run: |
            cd ${{ secrets.VPS_PROJECT_PATH }}
            git fetch origin
            git reset --hard origin/main
            chmod +x scripts/deploy.sh scripts/smoke_test.sh scripts/restart_workers.sh
            ./scripts/deploy.sh $(git rev-parse --short HEAD)
