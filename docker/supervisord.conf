; Configured for running multiple processes in one container 
; if explicitly requested via command: "supervisord"
; NOTE: Docker Compose default uses separate services.

[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
pidfile=/var/run/supervisord.pid
user=app

[program:gunicorn]
command=/app/entrypoint.sh web
autostart=true
autorestart=true
stdout_logfile=/app/logs/gunicorn.log
redirect_stderr=true

; Celery Workers - Per-Queue Configuration
; Each media type queue processes one item at a time (concurrency=1)
; This ensures sequential processing within each media type

[program:celery_worker_videos]
command=celery -A config worker -Q videos -c 1 --loglevel=info -n videos@%%h
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/worker_videos.log
redirect_stderr=true
stopwaitsecs=600

[program:celery_worker_audios]
command=celery -A config worker -Q audios -c 1 --loglevel=info -n audios@%%h
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/worker_audios.log
redirect_stderr=true
stopwaitsecs=600

[program:celery_worker_pdfs]
command=celery -A config worker -Q pdfs -c 1 --loglevel=info -n pdfs@%%h
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/worker_pdfs.log
redirect_stderr=true
stopwaitsecs=600

[program:celery_worker_seo]
command=celery -A config worker -Q seo -c 4 --loglevel=info -n seo@%%h
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/worker_seo.log
redirect_stderr=true
stopwaitsecs=300

[program:celery_worker_default]
command=celery -A config worker -Q default -c 2 --loglevel=info -n default@%%h
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/worker_default.log
redirect_stderr=true
stopwaitsecs=300