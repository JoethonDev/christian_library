<!-- templates/users/password_reset_confirm.html - Coptic Orthodox Theme -->
{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-8 col-lg-6">
        <div class="card card-coptic">
            <div class="card-body p-4 p-md-5 text-center">
                <div class="d-inline-flex align-items-center justify-content-center mb-4 sacred-shadow" style="width: 80px; height: 80px; background: var(--color-golden-ochre); border-radius: 50%; border: 3px solid var(--color-maroon);">
                    <svg class="bi text-white" style="font-size: 2.2rem;" aria-hidden="true" focusable="false"><use href="#bi-shield-lock"/></svg>
                </div>
                <h3 class="heading-font text-maroon fw-bold mb-2">{% trans "Password Reset" %}</h3>
                <p class="body-font text-muted mb-4">{% trans "Password reset confirmation is currently a placeholder page in this build." %}</p>
                <a href="{% url 'users:login' %}" class="btn btn-primary rounded-pill px-4">
                    {% trans "Back to Login" %}
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
