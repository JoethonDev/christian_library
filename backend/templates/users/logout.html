<!-- templates/users/logout.html - Coptic Orthodox Theme -->
{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="card card-coptic text-center">
            <div class="card-body p-4 p-md-5">
                <div class="d-inline-flex align-items-center justify-content-center mb-4 sacred-shadow" style="width: 80px; height: 80px; background: var(--color-maroon); border-radius: 50%; border: 3px solid var(--color-golden-ochre);">
                    <svg class="bi text-white" style="font-size: 2.2rem;" aria-hidden="true" focusable="false"><use href="#bi-box-arrow-right"/></svg>
                </div>
                <h3 class="heading-font text-maroon fw-bold mb-2">{% trans "Sign Out" %}</h3>
                <p class="body-font text-muted mb-4">{% trans "Use the button below to end your session." %}</p>

                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-primary btn-lg rounded-pill px-5">
                        {% trans "Logout" %}
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
