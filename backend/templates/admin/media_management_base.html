{% extends "layouts/admin_base.html" %}
{% load i18n %}

{% block admin_content %}
<div class="container-fluid px-0">
    <div class="row mb-4 align-items-center">
        <div class="col">
            <h1 class="h3 fw-bold text-dark mb-1">{{ management_ui.title }}</h1>
            <p class="text-muted mb-0">{{ management_ui.subtitle }}</p>
        </div>
        <div class="col-auto">
            <a href="{% url 'frontend_api:upload_content' %}?type={{ content_type }}" class="btn {{ management_ui.add_button_class }} rounded-pill px-4 shadow-sm">
                <svg class="bi me-2" aria-hidden="true" focusable="false"><use href="#{{ management_ui.add_icon }}"/></svg>{{ management_ui.add_label }}
            </a>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 mb-3">
        <div class="card-body">
            <form method="GET" class="row g-2 align-items-center"
                  hx-get="{% url 'frontend_api:media_management' media_type=content_type %}"
                  hx-target="#media-table-container"
                  hx-swap="innerHTML"
                  hx-trigger="submit, change from:select, keyup delay:500ms from:input[name='search']"
                  hx-push-url="true">
                <div class="col-md-5">
                    <input type="text" name="search" class="form-control" placeholder="{{ management_ui.search_placeholder }}" value="{{ filters.search }}">
                </div>
                <div class="col-md-3">
                    <select name="status" class="form-select">
                        <option value="">{% trans "All Status" %}</option>
                        <option value="active" {% if filters.status == 'active' %}selected{% endif %}>{% trans "Active" %}</option>
                        <option value="inactive" {% if filters.status == 'inactive' %}selected{% endif %}>{% trans "Inactive" %}</option>
                    </select>
                </div>
                {% if content_type == 'video' %}
                <div class="col-md-2">
                    <select name="processing_status" class="form-select">
                        <option value="">{% trans "All Processing" %}</option>
                        <option value="pending" {% if filters.processing_status == 'pending' %}selected{% endif %}>{% trans "Pending" %}</option>
                        <option value="processing" {% if filters.processing_status == 'processing' %}selected{% endif %}>{% trans "Processing" %}</option>
                        <option value="completed" {% if filters.processing_status == 'completed' %}selected{% endif %}>{% trans "Completed" %}</option>
                        <option value="failed" {% if filters.processing_status == 'failed' %}selected{% endif %}>{% trans "Failed" %}</option>
                    </select>
                </div>
                {% else %}
                <div class="col-md-2">
                    <select name="missing_data" class="form-select">
                        <option value="">{% trans "All Data" %}</option>
                        <option value="no_seo" {% if filters.missing_data == 'no_seo' %}selected{% endif %}>{% trans "Missing SEO" %}</option>
                        <option value="no_metadata" {% if filters.missing_data == 'no_metadata' %}selected{% endif %}>{% trans "Missing Metadata" %}</option>
                    </select>
                </div>
                {% endif %}
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">
                        <svg class="bi me-1" aria-hidden="true" focusable="false"><use href="#bi-funnel"/></svg>{% trans "Filter" %}
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 mb-3" id="bulkActionsBar" style="display: none;">
        <div class="card-body py-2">
            <div class="d-flex align-items-center justify-content-between">
                <div>
                    <span class="text-muted me-3">
                        <svg class="bi me-1" aria-hidden="true" focusable="false"><use href="#bi-check-circle"/></svg>
                        <span id="selectedCount">0</span> {% trans "selected" %}
                    </span>
                </div>
                <div class="btn-group" role="group">
                    <button type="button" class="btn btn-sm btn-warning text-white" onclick="bulkGenerateSEO()">
                        <svg class="bi me-1" aria-hidden="true" focusable="false"><use href="#bi-magic"/></svg>{% trans "Generate SEO" %}
                    </button>
                    <button type="button" class="btn btn-sm btn-success" onclick="bulkActivate()">
                        <svg class="bi me-1" aria-hidden="true" focusable="false"><use href="#bi-eye"/></svg>{% trans "Activate" %}
                    </button>
                    <button type="button" class="btn btn-sm btn-secondary" onclick="bulkDeactivate()">
                        <svg class="bi me-1" aria-hidden="true" focusable="false"><use href="#bi-eye-slash"/></svg>{% trans "Deactivate" %}
                    </button>
                    <button type="button" class="btn btn-sm btn-danger" onclick="bulkDelete()">
                        <svg class="bi me-1" aria-hidden="true" focusable="false"><use href="#bi-trash"/></svg>{% trans "Delete" %}
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden" id="media-table-container">
        {% include partial_template %}
    </div>
</div>

<script>
function toggleSelectAll(checkbox) {
    const checkboxes = document.querySelectorAll('.row-checkbox');
    checkboxes.forEach((cb) => {
        cb.checked = checkbox.checked;
    });
    updateBulkActions();
}

function updateBulkActions() {
    const checked = document.querySelectorAll('.row-checkbox:checked');
    const count = checked.length;
    const bulkBar = document.getElementById('bulkActionsBar');
    const selectedCount = document.getElementById('selectedCount');

    if (count > 0) {
        bulkBar.style.display = 'block';
        selectedCount.textContent = count;
    } else {
        bulkBar.style.display = 'none';
    }

    const allCheckboxes = document.querySelectorAll('.row-checkbox');
    const masterCheckbox = document.getElementById('selectAll');
    if (masterCheckbox) {
        masterCheckbox.checked = count === allCheckboxes.length && count > 0;
        masterCheckbox.indeterminate = count > 0 && count < allCheckboxes.length;
    }
}

function getSelectedIds() {
    const checkboxes = document.querySelectorAll('.row-checkbox:checked');
    return Array.from(checkboxes).map((cb) => cb.dataset.contentId);
}

function bulkGenerateSEO() {
    const selectedIds = getSelectedIds();
    if (selectedIds.length === 0) {
        showToast('{% trans "Please select at least one item" %}', 'warning');
        return;
    }

    const message = '{{ management_ui.bulk_generate_label|escapejs }}';
    const details = `<strong>{% trans "Selected items:" %}</strong> ${selectedIds.length}<br>` +
        `{% trans "This will use AI to generate SEO metadata for all selected items." %}`;

    showConfirmation(message, details, function () {
        performBulkAction('{% url "frontend_api:api_auto_fill_metadata" %}', selectedIds);
    });
}

function bulkActivate() {
    const selectedIds = getSelectedIds();
    if (selectedIds.length === 0) {
        showToast('{% trans "Please select at least one item" %}', 'warning');
        return;
    }

    const message = '{% trans "Activate selected items?" %}';
    const details = `<strong>{% trans "Selected items:" %}</strong> ${selectedIds.length}`;

    showConfirmation(message, details, function () {
        performBulkToggleStatus(selectedIds, true);
    });
}

function bulkDeactivate() {
    const selectedIds = getSelectedIds();
    if (selectedIds.length === 0) {
        showToast('{% trans "Please select at least one item" %}', 'warning');
        return;
    }

    const message = '{% trans "Deactivate selected items?" %}';
    const details = `<strong>{% trans "Selected items:" %}</strong> ${selectedIds.length}`;

    showConfirmation(message, details, function () {
        performBulkToggleStatus(selectedIds, false);
    });
}

function bulkDelete() {
    const selectedIds = getSelectedIds();
    if (selectedIds.length === 0) {
        showToast('{% trans "Please select at least one item" %}', 'warning');
        return;
    }

    const message = '{{ management_ui.delete_confirm_label|escapejs }}';
    const details = `<strong class="text-danger">{% trans "WARNING:" %}</strong> ` +
        `{% trans "This action cannot be undone!" %}`;

    showConfirmation(message, details, function () {
        performBulkDelete(selectedIds);
    });
}

function refreshTable() {
    const filterForm = document.querySelector('form[hx-get]');
    if (filterForm) {
        filterForm.dispatchEvent(new Event('submit', { cancelable: true }));
        setTimeout(() => {
            const masterCheckbox = document.getElementById('selectAll');
            if (masterCheckbox) {
                masterCheckbox.checked = false;
                masterCheckbox.indeterminate = false;
            }
            const bulkBar = document.getElementById('bulkActionsBar');
            if (bulkBar) {
                bulkBar.style.display = 'none';
            }
        }, 100);
    } else {
        window.location.reload();
    }
}

function performBulkAction(url, contentIds) {
    const data = { content_ids: contentIds };

    fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        },
        body: JSON.stringify(data)
    })
    .then((response) => response.json())
    .then((data) => {
        if (data.success) {
            showToast(data.message || '{% trans "Action completed successfully" %}', 'success');
            refreshTable();
        } else {
            showToast(data.error || '{% trans "Action failed" %}', 'danger');
        }
    })
    .catch((error) => {
        console.error('Error:', error);
        showToast('{% trans "An error occurred" %}', 'danger');
    });
}

function performBulkToggleStatus(contentIds, status) {
    fetch('{% url "frontend_api:api_toggle_content_status" %}', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        },
        body: JSON.stringify({
            content_ids: contentIds,
            is_active: status,
            bulk: true
        })
    })
    .then((response) => response.json())
    .then((data) => {
        if (data.success) {
            showToast(data.message || '{% trans "Status updated successfully" %}', 'success');
            refreshTable();
        } else {
            showToast(data.error || '{% trans "Failed to update status" %}', 'danger');
        }
    })
    .catch((error) => {
        console.error('Error:', error);
        showToast('{% trans "An error occurred" %}', 'danger');
    });
}

function performBulkDelete(contentIds) {
    fetch('{% url "frontend_api:bulk_operations" %}', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-CSRFToken': '{{ csrf_token }}'
        },
        body: new URLSearchParams({
            operation: 'delete',
            content_ids: contentIds.join(',')
        })
    })
    .then((response) => {
        if (response.ok) {
            showToast('{{ management_ui.delete_success_label|escapejs }}', 'success');
            refreshTable();
        } else {
            showToast('{{ management_ui.delete_failure_label|escapejs }}', 'danger');
        }
    })
    .catch((error) => {
        console.error('Error:', error);
        showToast('{% trans "An error occurred" %}', 'danger');
    });
}

function confirmAutoFill(contentId, title) {
    const message = '{{ management_ui.single_generate_label|escapejs }}';
    const details = `<strong>{% trans "Item:" %}</strong> ${title}<br>` +
        `{% trans "This will use AI to generate SEO metadata." %}`;

    showConfirmation(message, details, function () {
        autoFillMetadata(contentId);
    });
}

function toggleStatus(contentId, checkbox) {
    checkbox.disabled = true;

    fetch('{% url "frontend_api:api_toggle_content_status" %}', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        },
        body: JSON.stringify({
            content_id: contentId,
            is_active: checkbox.checked
        })
    })
    .then((response) => response.json())
    .then((data) => {
        checkbox.disabled = false;
        if (data.success) {
            showToast(data.is_active ? '{% trans "Content activated" %}' : '{% trans "Content hidden" %}', 'success');
        } else {
            checkbox.checked = !checkbox.checked;
            showToast(data.error || '{% trans "Failed to update status" %}', 'danger');
        }
    })
    .catch((error) => {
        checkbox.disabled = false;
        checkbox.checked = !checkbox.checked;
        console.error('Error:', error);
        showToast('{% trans "An error occurred" %}', 'danger');
    });
}

function autoFillMetadata(contentId) {
    fetch('{% url "frontend_api:api_auto_fill_metadata" %}', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        },
        body: JSON.stringify({
            content_id: contentId
        })
    })
    .then((response) => response.json())
    .then((data) => {
        if (data.success) {
            showToast('{% trans "Auto-fill started! Processing in background..." %}', 'success');
            setTimeout(() => refreshTable(), 2000);
        } else {
            showToast(data.error || '{% trans "Failed to start auto-fill" %}', 'danger');
        }
    })
    .catch((error) => {
        console.error('Error:', error);
        showToast('{% trans "An error occurred" %}', 'danger');
    });
}
</script>
{% endblock %}
