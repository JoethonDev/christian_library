<!-- templates/admin/partials/r2_status_table.html -->
{% load i18n %}
<div class="table-responsive" id="r2-status-table-container">
    <table class="table table-hover align-middle mb-0" id="status-table">
        <thead>
            <tr>
                <th class="admin-table-thead ps-4 border-0"></th>
                <th class="admin-table-thead border-0">{% trans "Content Item" %}</th>
                <th class="admin-table-thead border-0">{% trans "Type" %}</th>
                <th class="admin-table-thead border-0">{% trans "Status" %}</th>
                <th class="admin-table-thead border-0" style="width: 200px;">{% trans "Progress" %}</th>
                <th class="admin-table-thead border-0">{% trans "Created" %}</th>
                <th class="admin-table-thead text-end pe-4 border-0">{% trans "Actions" %}</th>
            </tr>
        </thead>
        <tbody id="status-tbody">
            <!-- Content will be loaded by the unified media management dashboard -->
        </tbody>
    </table>
</div>
