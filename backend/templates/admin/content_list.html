<!-- templates/admin/content_list.html - Modern Content Management -->
{% extends "layouts/admin_base.html" %}
{% load i18n %}

{% block admin_content %}
{% csrf_token %}
<div class="row mb-4 align-items-center">
    <div class="col">
        <h1 class="h3 fw-bold text-dark mb-1">{% trans "Content Management" %}</h1>
        <p class="text-muted mb-0">{% trans "Manage your library's videos, audio messages, and documents" %}</p>
    </div>
    <div class="col-auto d-flex gap-2">
        <button id="bulk-generate-ai" class="btn btn-outline-primary rounded-pill px-4" style="display:none;">
            <svg class="bi me-2" aria-hidden="true" focusable="false"><use href="#bi-magic"/></svg>{% trans "Generate with AI" %}
        </button>
        <a href="{% url 'frontend_api:upload_content' %}" class="btn btn-primary text-white rounded-pill px-4 shadow-sm">
            <svg class="bi me-2" aria-hidden="true" focusable="false"><use href="#bi-plus-lg"/></svg>{% trans "Upload" %}
        </a>
    </div>
</div>

<div class="card border-0 shadow-sm rounded-4 overflow-hidden">
    <div class="card-body p-4" 
         x-data="{ 
            q: '{{ search_query }}', 
            type: '{{ content_type }}', 
            sort: '{{ ordering }}', 
            limit: '{{ per_page }}',
            updateUrl() {
                const url = new URL(window.location);
                if (this.q) url.searchParams.set('q', this.q); else url.searchParams.delete('q');
                if (this.type) url.searchParams.set('type', this.type); else url.searchParams.delete('type');
                if (this.sort) url.searchParams.set('sort', this.sort); else url.searchParams.delete('sort');
                if (this.limit) url.searchParams.set('limit', this.limit); else url.searchParams.delete('limit');
                window.history.replaceState({}, '', url);
            }
         }"
         @htmx:after-request="updateUrl()">
        <!-- Search and Filter Section -->
        <div class="row g-3 align-items-center mb-4">
            <div class="col-lg-12">
                <form hx-get="{% url 'frontend_api:admin_content_list' %}" 
                      hx-target="#admin-content-table" 
                      hx-trigger="change, keyup delay:300ms from:input"
                      class="row g-2">
                    
                    <div class="col-md-4 position-relative">
                        <span class="position-absolute top-50 start-0 translate-middle-y ms-3 text-muted">
                            <svg class="bi" aria-hidden="true" focusable="false"><use href="#bi-search"/></svg>
                        </span>
                        <input type="search" name="q" x-model="q" class="form-control rounded-pill ps-5 bg-light border-0" 
                               placeholder="{% trans 'Search content...' %}" 
                               value="{{ search_query }}">
                    </div>
                    
                    <div class="col-md-3">
                        <select name="type" x-model="type" class="form-select rounded-pill bg-light border-0">
                            <option value="">{% trans "All Types" %}</option>
                            <option value="video" {% if content_type == 'video' %}selected{% endif %}>{% trans "Videos" %}</option>
                            <option value="audio" {% if content_type == 'audio' %}selected{% endif %}>{% trans "Audios" %}</option>
                            <option value="pdf" {% if content_type == 'pdf' %}selected{% endif %}>{% trans "PDFs" %}</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <select name="sort" x-model="sort" class="form-select rounded-pill bg-light border-0">
                            <option value="-created_at" {% if ordering == '-created_at' %}selected{% endif %}>{% trans "Newest First" %}</option>
                            <option value="created_at" {% if ordering == 'created_at' %}selected{% endif %}>{% trans "Oldest First" %}</option>
                            <option value="title_ar" {% if ordering == 'title_ar' %}selected{% endif %}>{% trans "Title (Arabic) A-Z" %}</option>
                            <option value="title_en" {% if ordering == 'title_en' %}selected{% endif %}>{% trans "Title (English) A-Z" %}</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <select name="limit" x-model="limit" class="form-select rounded-pill bg-light border-0">
                            <option value="10" {% if per_page == 10 %}selected{% endif %}>10 / {% trans "page" %}</option>
                            <option value="20" {% if per_page == 20 %}selected{% endif %}>20 / {% trans "page" %}</option>
                            <option value="50" {% if per_page == 50 %}selected{% endif %}>50 / {% trans "page" %}</option>
                            <option value="100" {% if per_page == 100 %}selected{% endif %}>100 / {% trans "page" %}</option>
                        </select>
                    </div>
                </form>
            </div>
        </div>

        <!-- Content Table Component -->
        <div id="admin-content-table" class="table-responsive">
            {% include "admin/partials/content_list.html" %}
        </div>
    </div>
</div>

<script>
// Multi-selection for batch AI generation
document.addEventListener('DOMContentLoaded', function() {
    const bulkBtn = document.getElementById('bulk-generate-ai');
    
    // Update bulk button visibility based on selection
    function updateBulkButton() {
        const selected = document.querySelectorAll('input[name="content_select"]:checked').length;
        if (selected > 0) {
            bulkBtn.style.display = 'block';
            bulkBtn.innerHTML = `<svg class="bi me-2" aria-hidden="true" focusable="false"><use href="#bi-magic"/></svg>{% trans "Generate AI for" %} ${selected} {% trans "items" %}`;
        } else {
            bulkBtn.style.display = 'none';
        }
    }
    
    // Listen for checkbox changes
    document.addEventListener('change', function(e) {
        if (e.target.name === 'content_select' || e.target.id === 'select-all') {
            updateBulkButton();
        }
    });
    
    // Handle select all
    document.addEventListener('change', function(e) {
        if (e.target.id === 'select-all') {
            document.querySelectorAll('input[name="content_select"]').forEach(cb => {
                cb.checked = e.target.checked;
            });
            updateBulkButton();
        }
    });
    
    // Bulk AI generation
    bulkBtn.addEventListener('click', function() {
        const selectedIds = Array.from(document.querySelectorAll('input[name="content_select"]:checked'))
            .map(cb => cb.value);
        
        if (selectedIds.length === 0) {
            return;
        }
        
        // Direct action without confirmation
        showToast('{% trans "Generating metadata with AI..." %}', 'info');
        
        // Build FormData with multiple content_ids parameters
        const formData = new FormData();
        formData.append('action', 'generate_seo');
        selectedIds.forEach(id => {
            formData.append('content_ids', id);
        });
        
        fetch('{% url "frontend_api:bulk_seo_actions_api" %}', {
            method: 'POST',
            headers: {
                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value || '{{ csrf_token }}'
            },
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success || data.messages) {
                showToast(`{% trans "Queued AI generation for" %} ${data.success || selectedIds.length} {% trans "items" %}`, 'success');
                // Uncheck all
                document.querySelectorAll('input[name="content_select"]').forEach(cb => cb.checked = false);
                document.getElementById('select-all').checked = false;
                updateBulkButton();
            } else {
                showToast(data.error || '{% trans "Failed to queue AI generation" %}', 'danger');
            }
        })
        .catch(err => {
            showToast('{% trans "An error occurred while queueing AI generation" %}', 'danger');
            console.error(err);
        });
    });
});
</script>
{% endblock %}
