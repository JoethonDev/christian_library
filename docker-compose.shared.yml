services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-christian_library_db}
      POSTGRES_USER: ${DB_USER:-christian_library_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-christian_library_user} -d ${DB_NAME:-christian_library_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    command: >
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=6GB       -c max_connections=300      -c maintenance_work_mem=512MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - backend

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - ./docker/nginx/htpasswd:/etc/nginx/htpasswd:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      - portainer
    networks:
      - frontend

  celery_worker_primary:
    image: christian-library-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["worker", "-Q", "media_processing", "-c", "1", "-n", "primary@%h"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - logs_data:/app/logs
    networks:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M

  celery_worker_secondary:
    image: christian-library-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["worker", "-Q", "media_processing", "-c", "1", "-n", "secondary@%h"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - logs_data:/app/logs
    networks:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M

  celery_worker_uploads:
    image: christian-library-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["worker", "-Q", "uploads", "-c", "5", "-n", "uploads@%h"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - logs_data:/app/logs
    networks:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  celery_worker_gemini:
    image: christian-library-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["worker", "-Q", "gemini", "-c", "2", "-n", "gemini@%h"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - logs_data:/app/logs
    networks:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  celery_beat:
    image: christian-library-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["beat"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - logs_data:/app/logs
    networks:
      - backend
      - frontend

  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - frontend

  migration:
    image: christian-library-app:${IMAGE_TAG:-latest}
    profiles:
      - donotstart
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - logs_data:/app/logs
    networks:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
  logs_data:
  portainer_data:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 2001:db8:11::/64
